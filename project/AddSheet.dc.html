<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style>
@keyframes jjkCaret{0%,45%{opacity:1}55%,100%{opacity:0}}
.jjk-note::placeholder{color:#98989F}
</style>
</helmet>
<div data-screen-label="记账弹出页" style="{{ themeVars }};height:100%;display:flex;flex-direction:column;background:var(--card);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased">
  <div style="display:flex;justify-content:center;padding-top:8px">
    <div style="width:36px;height:5px;border-radius:3px;background:var(--ter)"></div>
  </div>
  <div style="position:relative;display:flex;justify-content:center;align-items:center;padding:10px 16px 6px">
    <div onClick="{{ onCancel }}" style="position:absolute;left:16px;font-size:17px;color:var(--accent);cursor:pointer;padding:6px 4px">取消</div>
    <div style="display:flex;background:var(--fill);border-radius:9px;padding:2px;width:200px">
      <sc-for list="{{ segs }}" as="s" hint-placeholder-count="2">
        <div onClick="{{ s.onTap }}" style="flex:1;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;background:{{ s.bg }};color:{{ s.color }};box-shadow:{{ s.shadow }}">{{ s.label }}</div>
      </sc-for>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:14px 20px 4px;min-height:168px;align-content:start">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="8">
      <div onClick="{{ c.onTap }}" style="display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
        <div style="width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:24px;background:{{ c.bg }};box-shadow:{{ c.ring }}">{{ c.emoji }}</div>
        <div style="font-size:12px;font-weight:{{ c.w }};color:{{ c.color }}">{{ c.name }}</div>
      </div>
    </sc-for>
  </div>
  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 24px 8px">
    <span style="font-size:26px;font-weight:600;color:var(--sec)">¥</span>
    <span style="font-size:46px;font-weight:700;letter-spacing:-0.5px;font-variant-numeric:tabular-nums;color:{{ amountColor }}">{{ amountDisplay }}</span>
    <span style="width:3px;height:38px;border-radius:2px;background:var(--accent);animation:jjkCaret 1s infinite"></span>
  </div>
  <div style="display:flex;gap:10px;padding:2px 16px 10px">
    <input class="jjk-note" placeholder="添加备注…" value="{{ note }}" onChange="{{ onNote }}" style="flex:1;height:40px;border-radius:10px;background:var(--fill);border:none;outline:none;padding:0 12px;font-size:15px;color:var(--text);font-family:inherit;min-width:0">
    <div onClick="{{ onDateTap }}" style="height:40px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 14px;cursor:pointer">
      <span style="font-size:15px;font-weight:600;color:var(--accent)">今天</span>
      <span style="font-size:13px;color:var(--sec)">7月4日</span>
    </div>
  </div>
  <div style="position:relative;display:flex;gap:10px;padding:0 16px 10px">
    <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:-46px;left:50%;transform:translateX(-50%);background:rgba(30,30,32,0.92);color:#fff;font-size:13px;padding:8px 14px;border-radius:18px;white-space:nowrap;z-index:5">{{ toast }}</div>
    </sc-if>
    <div onClick="{{ onMic }}" style="flex:1;height:44px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer" style-active="transform:scale(0.97)">
      <span style="font-size:17px">🎤</span><span style="font-size:14px;font-weight:500;color:var(--text)">语音记账</span>
    </div>
    <div onClick="{{ onImg }}" style="flex:1;height:44px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer" style-active="transform:scale(0.97)">
      <span style="font-size:17px">🖼</span><span style="font-size:14px;font-weight:500;color:var(--text)">截图记账</span>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:52px;gap:8px;padding:4px 12px 0">
    <div onClick="{{ onDone }}" style="grid-column:4;grid-row:1/5;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:#FFFFFF;cursor:pointer;opacity:{{ doneOpacity }}" style-active="filter:brightness(0.92)">完成</div>
    <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
      <div onClick="{{ k.onTap }}" style="border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:500;color:var(--text);cursor:pointer;user-select:none" style-active="filter:brightness(0.85);transform:scale(0.97)">{{ k.label }}</div>
    </sc-for>
  </div>
  <div style="height:28px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:788},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSave&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(entry: object) =&gt; void&quot;},&quot;onCancel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { isExpense: true, selE: 7, selI: 3, amount: '', note: '', toast: '' };

  cats() {
    return this.state.isExpense
      ? [['🍜','餐饮'],['🚇','交通'],['🛍️','购物'],['🧻','日用'],['🎮','娱乐'],['💊','医疗'],['🏠','住房'],['📦','其他']]
      : [['💰','工资'],['🧧','红包'],['📈','理财'],['📦','其他']];
  }
  tint(name) {
    return ({
      '餐饮':'rgba(255,149,0,0.16)','交通':'rgba(0,122,255,0.15)','购物':'rgba(255,45,85,0.13)',
      '日用':'rgba(48,176,199,0.16)','娱乐':'rgba(175,82,222,0.15)','医疗':'rgba(255,59,48,0.13)',
      '住房':'rgba(88,86,214,0.15)','其他':'rgba(120,120,128,0.16)','工资':'rgba(52,199,89,0.16)',
      '红包':'rgba(255,59,48,0.13)','理财':'rgba(0,199,190,0.16)'
    })[name];
  }
  showToast(msg) {
    clearTimeout(this._tt);
    this.setState({ toast: msg });
    this._tt = setTimeout(() => this.setState({ toast: '' }), 1800);
  }
  tap(ch) {
    let a = this.state.amount;
    if (ch === '⌫') { a = a.slice(0, -1); }
    else if (ch === '.') { if (a.includes('.')) return; a = (a === '' ? '0' : a) + '.'; }
    else {
      if (a.includes('.')) {
        const d = a.split('.')[1];
        if (d.length >= 2) return;
        a += ch;
      } else {
        if (a === '0') { a = ch; }
        else if (a.length >= 6) { this.showToast('金额最大 999999.99'); return; }
        else { a += ch; }
      }
    }
    this.setState({ amount: a });
  }
  renderVals() {
    const st = this.state, dark = !!this.props.dark;
    const themeVars = dark
      ? '--card:#1C1C1E;--text:#FFFFFF;--sec:rgba(235,235,245,0.6);--ter:rgba(235,235,245,0.3);--sep:rgba(84,84,88,0.65);--fill:rgba(120,120,128,0.22);--accent:#FF9F0A;--green:#30D158;--segsel:#636366'
      : '--card:#FFFFFF;--text:#000000;--sec:rgba(60,60,67,0.6);--ter:rgba(60,60,67,0.3);--sep:rgba(60,60,67,0.12);--fill:rgba(120,120,128,0.12);--accent:#FF9500;--green:#34C759;--segsel:#FFFFFF';
    const selIdx = st.isExpense ? st.selE : st.selI;
    const cats = this.cats().map(([emoji, name], i) => {
      const sel = i === selIdx;
      return {
        emoji, name,
        bg: sel ? 'var(--accent)' : this.tint(name),
        ring: sel ? '0 0 0 3px ' + (dark ? 'rgba(255,159,10,0.3)' : 'rgba(255,149,0,0.25)') : 'none',
        color: sel ? 'var(--accent)' : 'var(--sec)',
        w: sel ? 600 : 400,
        onTap: () => this.setState(st.isExpense ? { selE: i } : { selI: i }),
      };
    });
    const segs = [{ label: '支出', sel: st.isExpense }, { label: '收入', sel: !st.isExpense }].map((s, i) => ({
      label: s.label,
      bg: s.sel ? 'var(--segsel)' : 'transparent',
      color: s.sel ? 'var(--text)' : 'var(--sec)',
      shadow: s.sel ? '0 1px 4px rgba(0,0,0,0.18)' : 'none',
      onTap: () => this.setState({ isExpense: i === 0 }),
    }));
    const keys = ['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k => ({ label: k, onTap: () => this.tap(k) }));
    const num = parseFloat(st.amount) || 0;
    return {
      themeVars, cats, segs, keys,
      amountDisplay: st.amount === '' ? '0.00' : st.amount,
      amountColor: st.amount === '' ? 'var(--ter)' : 'var(--text)',
      note: st.note,
      onNote: (e) => this.setState({ note: e.target.value }),
      toast: st.toast, hasToast: !!st.toast,
      onMic: () => this.showToast('🎤 语音识别 + 确认卡片：下一轮补充'),
      onImg: () => this.showToast('🖼 截图识别：下一轮补充'),
      onDateTap: () => this.showToast('日期选择：下一轮补充'),
      doneOpacity: num > 0 ? 1 : 0.45,
      onDone: () => {
        if (num <= 0) { this.showToast('请输入金额'); return; }
        const [emoji, name] = this.cats()[selIdx];
        const entry = { emoji, name, tint: this.tint(name), note: st.note.trim(), amount: num, income: !st.isExpense };
        this.setState({ amount: '', note: '' });
        if (this.props.onSave) this.props.onSave(entry);
      },
      onCancel: () => { if (this.props.onCancel) this.props.onCancel(); },
    };
  }
}
</script>
</body>
</html>
